- aid: the-mobility-house-chargepilot-charging-data-push-api
  name: ChargePilot Charging Data Push-API
  description: 'Outbound cloud-to-cloud push of billing-relevant charging session records. On completion
    of a charging session ChargePilot POSTs a JSON payload over HTTPS to a customer-supplied endpoint,
    batched by default hourly, authenticating itself to the receiver with an Ocp-Apim-Subscription-Key
    header. Each record carries TransactionID, ChargerID (the OCPP station identifier), ConnectorID,
    StartAt and EndAt UTC timestamps, the RFID Id presented, EnergyDelivered in Wh, and InitialSoC /
    EndSoC where the charging point is DC. All current and future charging sites on the account are
    included automatically.'
  humanURL: https://tmh-help.freshdesk.com/en/support/solutions/articles/203000046009-chargepilot-charging-data-push-api
  baseURL: ''
  x-baseurl-note: 'Deliberately empty. This is an outbound webhook: ChargePilot POSTs to a host the
    CUSTOMER operates, so the base URL belongs to the consumer, not to The Mobility House. The provider
    documents the destination only as a customer-supplied HTTPS URL.'
  tags:
