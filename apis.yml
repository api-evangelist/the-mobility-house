aid: the-mobility-house
name: The Mobility House
description: 'The Mobility House (TMH) is a Munich-headquartered electric-mobility and energy technology
  company, founded in 2009, with offices in Zurich, Montreal, Paris, Singapore and Belmont (USA). Its
  ChargePilot smart charging and energy management system pairs an on-site controller with a cloud
  dashboard to run dynamic load management across mixed-vendor AC and DC charging infrastructure, and
  its Vehicle-to-Grid (V2G) platform markets electric-vehicle battery capacity into energy and
  grid-balancing markets. ChargePilot integrates with third-party systems over open, standards-based
  interfaces rather than a public REST developer program: OCPP to charging stations, a VDV 463 WebSocket
  interface to depot and fleet management systems, a Modbus TCP/IP server for building and site energy
  management systems, and an outbound Charging Data Push-API that delivers completed charging sessions
  as JSON to a customer endpoint.'
