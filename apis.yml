apis:
- aid: the-mobility-house-chargepilot-vdv-463
  name: ChargePilot VDV 463 Interface
  description: 'Two-way WebSocket-Secure interface between ChargePilot (acting as the Charging Management
    System, CMS) and an upstream Depot Management, Fleet Management or ITCS system, implemented against
    the VDV 463 standard published by the Verband Deutscher Verkehrsunternehmen. ChargePilot pushes
    ProvideChargingInformation.req messages carrying a DepotInfoList (depot setup, charging station and
    charging point statuses, live charging processes, fault information) every 15 seconds; the upstream
    system may optionally push ProvideChargingRequests.req messages carrying per-vehicle charging
    schedules. The session opens with a WebSocket TLS handshake authenticated with HTTP Basic
    credentials issued by The Mobility House, followed by a BootNotification.req/.conf exchange.'
  humanURL: https://vdv-docs.tmh.energy/
  baseURL: ''
  x-baseurl-note: 'Deliberately empty, not a gap in the pass. The VDV 463 WebSocket-Secure endpoint is
    provisioned per customer site by The Mobility House at the time the site is enabled, and is
    delivered privately with the credentials; no base URL is stated anywhere in the public technical
    guideline. api.tmh.energy resolves and is a Mobility House host, but it answers HTTP 503 from nginx
    on every path probed (/, /openapi.json, /docs, /v1/openapi.json, /swagger.json, /api-docs, /redoc,
    2026-08-30) and is named in no document, so it is not asserted as the base.'
  tags:
  - VDV 463
  - WebSocket
  - Depot Management
  - Charging Schedules
  - Smart Charging
