  highlights:
  - 'Charging Events: date picker with quick links for common reporting periods, improved search,
    relocated export button, per-user persisted column selection, and detailed session summaries
    showing charging power intervals and State-of-Charge progression.'
  - 'Load & Energy Statistics: calculation switched to rely on data from ChargePilot''s optimizer
    rather than charger-internal data; configurable 15-minute, hourly, daily, weekly, monthly and
    yearly resolutions; fleet-wide total energy and peak load; multi-distribution statistics; CSV
    export at 15-minute granularity.'
  - 'Charging Station Settings: site-scoped navigation, table columns for station ID, firmware version
    and fallback configuration, persisted column preferences, and single-click firmware updates
    deployable across multiple sites.'
  note: 'Dashboard and reporting changes only. No change to the VDV 463 interface, the Charging Data
    Push-API payload or the Modbus register map was announced in this entry.'
