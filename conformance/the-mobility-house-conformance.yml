standards:
- id: ocpp
  name: Open Charge Point Protocol
  versions: ['1.6', '2.0.1', '2.1']
  conforms: true
  evidence: 'ChargePilot integrates charging stations from multiple manufacturers over OCPP, including
    mixed AC/DC estates (https://www.mobilityhouse.com/int_en/chargepilot/open-interfaces). The
    Mobility House also authors and maintains the reference open-source Python implementation of the
    JSON version of OCPP at https://github.com/mobilityhouse/ocpp (PyPI ocpp 2.1.0, 2025-07-16), and
    publishes an OCPP status/error-code mapping table at https://vdv-docs.tmh.energy/mapping/mapping.'
  role: 'Central system / CSMS toward charging stations; also upstream library author.'
- id: modbus-tcp
  name: Modbus TCP/IP
  conforms: true
  evidence: 'The TMH Controller acts as a Modbus TCP/IP server (slave ID 1, big-endian register order)
    with a published register map — total live values at 0x0001-0x0020, administration registers at
    0x100A-0x1013, grid-limit holding registers at 0x2000-0x2001 and 0x2008-0x2009, per-charging-point
    live values from 0x3000 with a 256-decimal offset per connector — documented at
    https://tmh-help.freshdesk.com/en/support/solutions/articles/203000046016-chargepilot-modbus-interface.'
  role: server
