note: 'The Mobility House publishes no rate limits, no quotas, no burst allowance and no rate-limit
  response headers for any of its interfaces, and there is no documented status code for exhaustion.
  limit_count is an honest zero. What the provider does publish is cadence, which is the governing
  runtime constraint on these interfaces — they are push/streaming surfaces, not request-quota
  surfaces, so an integrator is paced by the provider rather than throttled by it.'
